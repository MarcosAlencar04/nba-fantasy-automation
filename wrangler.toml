name = "nba-fantasy"
main = "src/index.ts"
compatibility_date = "2026-10-27"

[observability]
enabled = true

# 10:00 em America/Sao_Paulo (UTC-3) = 13:00 UTC. Cron do Workers e sempre em UTC.
[triggers]
crons = ["0 13 * * *"]

[[containers]]
class_name = "FantasyRunner"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "RUNNER"
class_name = "FantasyRunner"

[exports.FantasyRunner]
type = "durable-object"
storage = "sqlite"
