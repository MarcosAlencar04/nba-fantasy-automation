<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NBA Fantasy{% endblock %}</title>
<style>
  :root {
    --bg:#0a0d13; --card:#141a24; --soft:#1b2230; --line:#242e3d;
    --ink:#eef2f8; --muted:#8b96a8; --orange:#f97316;
    --green-bg:#10281c; --green:#4ade80;
    --red-bg:#2a1417; --red:#f87171;
    --amber-bg:#2b2210; --amber:#fbbf24;
    --blue-bg:#12243a; --blue:#60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header {
    background:var(--soft); border-bottom:1px solid var(--line);
    padding:14px 24px; display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .brand { color:var(--orange); font-weight:700; letter-spacing:1.6px;
           text-transform:uppercase; font-size:11px; }
  nav a { color:var(--muted); font-weight:600; font-size:13px; margin-right:17px; }
  nav a.on { color:var(--ink); border-bottom:2px solid var(--orange); padding-bottom:3px; }
  main { max-width:1150px; margin:0 auto; padding:24px; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:20px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  th {
    text-align:left; padding:10px 13px; font-size:10px; letter-spacing:.7px;
    text-transform:uppercase; color:var(--muted); background:var(--soft);
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td { padding:10px 13px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tr.dead td { opacity:.45; }
  .pill {
    display:inline-block; padding:2px 9px; border-radius:999px;
    font-size:10px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
  }
  .on  { background:var(--green-bg); color:var(--green); }
  .off { background:var(--amber-bg); color:var(--amber); }
  .del { background:var(--red-bg);   color:var(--red); }
  .btn {
    display:inline-block; padding:8px 15px; border-radius:7px; border:1px solid var(--line);
    background:var(--soft); color:var(--ink); font-size:13px; font-weight:600;
    cursor:pointer; text-decoration:none;
  }
  .btn:hover { text-decoration:none; border-color:var(--muted); }
  .btn.primary { background:var(--orange); border-color:var(--orange); color:#1a0d02; }
  .btn.tiny { padding:4px 10px; font-size:11px; }
  .btn.danger { background:var(--red-bg); color:var(--red); border-color:var(--red-bg); }
  form.inline { display:inline; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
          color:var(--muted); margin-bottom:5px; font-weight:600; }
  input[type=text], input[type=password], input[type=number], input[type=email],
  input[type=email], textarea, select {
    width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line);
    background:var(--soft); color:var(--ink); font:inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline:none; border-color:var(--orange);
  }
  textarea { min-height:78px; resize:vertical; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field { margin-bottom:16px; }
  .check { display:flex; align-items:center; gap:8px; }
  .check input { width:auto; }
  .check label { margin:0; text-transform:none; font-size:13px; color:var(--ink); }
  .msg, .err {
    padding:11px 14px; border-radius:8px; margin-bottom:16px; font-size:13px;
  }
  .msg { background:var(--green-bg); color:var(--green); border-left:3px solid var(--green); }
  .err { background:var(--red-bg);   color:var(--red);   border-left:3px solid var(--red); }
  .muted { color:var(--muted); font-size:12px; }
  .hint { color:var(--muted); font-size:11px; margin-top:5px; }
  .filters a { padding:5px 11px; border-radius:6px; font-size:12px; color:var(--muted); }
  .filters a.on { background:var(--soft); color:var(--ink); }
  @media (max-width:760px) {
    .grid { grid-template-columns:1fr; }
    main { padding:14px; }
    td, th { padding:8px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">NBA Fantasy</span>
  <nav>
    <a href="/users"   class="{{ 'on' if active_nav == 'users'   else '' }}">Usuarios</a>
    <a href="/leagues" class="{{ 'on' if active_nav == 'leagues' else '' }}">Ligas</a>
    <a href="/health" target="_blank">Saude</a>
  </nav>
</header>
<main>
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
