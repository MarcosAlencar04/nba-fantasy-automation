name: NBA Fantasy

on:
  schedule:
    # ATENCAO: o `schedule` do Actions e' best-effort. A documentacao avisa que
    # "high load times include the start of every hour" e que, com carga alta,
    # "some queued jobs may be dropped". O cron antigo era `0 13 * * *` — minuto
    # 0, o pior horario possivel — e simplesmente **nao disparou** em 28/10 nem
    # em 29/10, ou seja, o relatorio da manha nao saiu duas vezes seguidas.
    #
    # Medido neste repositorio: 6 execucoes agendadas em ~48h, quando `*/30`
    # deveria produzir ~96. Cerca de 6% das tentativas sobrevivem.
    #
    # Por isso a manha tem TRES tentativas (minutos fora do pico) e a
    # notificacao usa uma trava no banco (`state.py`) para nao duplicar email:
    # a primeira que passar envia, as outras saem sem notificar.
    - cron: "7 13 * * *"      # 10:07 BRT - tentativa principal
    - cron: "37 13 * * *"     # 10:37 BRT - retry 1
    - cron: "7 14 * * *"      # 11:07 BRT - retry 2 (ultima rede de seguranca)
    # Pre-jogo: minutos 5 e 35, tambem fora do minuto 0 (pico documentado).
    # O gate libera a execucao 30 min antes de CADA jogo do dia.
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "morning = relatorio da manha; gate = so se estiver perto do jogo"
        type: choice
        default: morning
        options: [morning, gate]

permissions:
  contents: read

jobs:
  # Um unico gate para toda a liga: o placar da NBA e o mesmo para todos os
  # times, entao nao faz sentido pagar um spin-up por time para descobrir que
  # nao ha jogo agora.
  gate:
    # Runner fixado de proposito: `ubuntu-latest` esta migrando para o Ubuntu 26
    # e o apelido muda de significado sem aviso no meio do campeonato.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}
    env:
      # Modo da execucao, em tres camadas:
      #
      # 1. `github.event_name == 'schedule'` vem primeiro por seguranca: num
      #    dispatch o `github.event.schedule` e' nulo, e comparar nulo dentro de
      #    `contains` pode avaliar como erro em vez de `false`. Com o `&&` curto-
      #    circuitando, o `contains` nem e' avaliado fora do schedule.
      # 2. `inputs.mode` (o contexto `inputs`, nao `github.event.inputs`) aplica o
      #    `default: morning` do `workflow_dispatch`. Sem isto, um disparo pela
      #    API **sem** `inputs` cairia em `gate`, porque `github.event.inputs`
      #    nao recebe os defaults.
      # 3. `gate` e' o resto (crons de pre-jogo).
      MODE: ${{ (github.event_name == 'schedule' && contains(fromJSON('["7 13 * * *","37 13 * * *","7 14 * * *"]'), github.event.schedule)) && 'morning' || inputs.mode || 'gate' }}
      # Janela do gate: 30 min antes de cada jogo. Com cron de 30 min, cada jogo
      # cai em exatamente uma execucao -> um aviso por jogo, sem repeticao.
      PREGAME_LEAD_MIN: "30"
    steps:
      # persist-credentials=false: o job so le o repositorio, entao o
      # GITHUB_TOKEN nao precisa ficar guardado no .git/config do runner.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # O gate so usa a stdlib, entao as execucoes "vazias" (a maioria) nao
      # gastam setup de Python nem pip.
      - name: Decidir se executa agora
        id: gate
        run: python3 gate.py

  # Os times vem do BANCO (Neon), com fallback para as listas posicionais nos
  # secrets quando DATABASE_URL nao existe:
  #
  #   banco    -> users JOIN leagues, WHERE is_active  (padrao)
  #   secrets  -> ESPN_TEAM_ID=7,9,11 + EMAIL_TO + TELEGRAM_CHAT_ID
  #
  # Nao ha limite de quantidade: o matrix e' montado a partir do que estiver
  # cadastrado e ativo no painel.
  #
  # A normalizacao fica em teams.py, usado por ESTE job e pelo job do agente. A
  # versao anterior fazia `awk -F,` aqui e um heredoc Python la, e as duas
  # discordavam quando a lista tinha virgula final ou quebra de linha — o matrix
  # ganhava indices sem time e o run quebrava.
  times:
    needs: gate
    # Sem isso este job subiria nas 48 execucoes do dia so para montar o matrix.
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # So o cliente do Postgres: as demais dependencias (pandas/scipy) sao
      # pesadas e nao sao usadas para montar o matrix.
      - name: Instalar cliente do banco
        if: env.DATABASE_URL != ''
        run: pip install "psycopg[binary]==3.2.10"

      - name: Contar times
        id: load
        run: |
          set -eu
          # So indices e nomes vao para o matrix: e-mails e chat ids nao
          # aparecem na lista de jobs do Actions.
          matrix=$(python3 teams.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  agente:
    needs: [gate, times]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Cada time roda no proprio runner, entao .cache e reports/ nao colidem. O
    # grupo por indice evita que duas execucoes do mesmo time se sobreponham.
    concurrency:
      group: nba-fantasy-${{ matrix.index }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.times.outputs.matrix) }}
    env:
      # Slot da trava de envio. Na manha o proprio agente usa `morning`; no
      # pre-jogo vem do gate (ex.: `pre:20261030T2330`), derivado da hora do
      # jogo. E' o que impede dois crons do mesmo minuto (GitHub + Cloudflare)
      # de mandarem dois emails do mesmo jogo.
      SLOT: ${{ needs.gate.outputs.slot }}
      # Mesma expressao do job `gate` (ver comentario la).
      MODE: ${{ (github.event_name == 'schedule' && contains(fromJSON('["7 13 * * *","37 13 * * *","7 14 * * *"]'), github.event.schedule)) && 'morning' || inputs.mode || 'gate' }}
      INDEX: ${{ matrix.index }}
      # Fonte da lista. DATABASE_URL tem precedencia; os secrets posicionais so
      # sao usados quando ela nao existe (modo legado).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # ESPN_LEAGUE_ID / ESPN_SWID / ESPN_S2 NAO ficam aqui: o passo "Resolver
      # destinatario" escreve os tres no $GITHUB_ENV a partir da tabela
      # `leagues`, entao cada usuario usa as credenciais da PROPRIA liga. Manter
      # os secrets aqui criaria duas fontes para o mesmo dado — e um cookie
      # velho no secret mascararia o cookie novo do banco.
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'NBA Fantasy Daily Report' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Recorta o usuario INDEX da fonte (banco ou secrets), com a mesma
      # normalizacao que o job `times` usou para montar o matrix. Uma entrada
      # vazia (ou um placeholder como "XXX") desliga aquele canal para este
      # usuario — nao cai no destinatario de outro, senao o relatorio vazaria
      # para a pessoa errada.
      #
      # Roda DEPOIS do pip install porque precisa do psycopg para ler o banco.
      - name: Resolver destinatario
        run: |
          set -eu
          python3 teams.py resolve "$INDEX" >> "$GITHUB_ENV"

      - name: Rodar o agente
        run: |
          # A execucao da manha traz o relatorio completo; as demais (pre-jogo)
          # trazem so escalacao e IR.
          ARGS="--notify --out-dir reports/$INDEX"
          if [ "$MODE" != "morning" ]; then
            ARGS="$ARGS --lineup-only"
            # Pre-jogo tambem passa pela trava, com o slot que o gate derivou
            # da hora do jogo. Se por algum motivo o slot vier vazio (dispatch
            # manual), o agente segue sem deduplicar.
            if [ -n "${SLOT:-}" ]; then
              ARGS="$ARGS --once-per-day $SLOT"
            fi
          else
            # Trava de retry: a manha tem tres crons porque o agendador do
            # GitHub derruba a maioria das execucoes. O slot faz o agente
            # reivindicar o dia no banco, entao so a primeira tentativa que
            # passar envia email — as outras saem sem notificar.
            ARGS="$ARGS --once-per-day morning"
          fi
          # Nome, e-mail e chat id vem do banco via $GITHUB_ENV e NAO sao
          # mascarados pelo Actions (o mascaramento so vale para `secrets.X`).
          # Como este repositorio e' publico, mostramos apenas a presenca de
          # cada canal: o suficiente para diagnosticar, sem expor o cliente.
          nome="${USER_NAME:-}"
          if [ -n "$nome" ]; then nome="${nome:0:1}***"; else nome="<sem nome>"; fi
          echo "usuario: $nome (team_id ${ESPN_TEAM_ID:-?}) | modo: $MODE"
          echo "destinatario: $( [ -n "${EMAIL_TO:-}" ] && echo definido || echo '<sem email>') / $( [ -n "${TELEGRAM_CHAT_ID:-}" ] && echo definido || echo '<sem telegram>')"
          python nba-fantasy-agent.py $ARGS

      - name: Guardar o relatorio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-${{ matrix.index }}-${{ github.run_id }}
          path: reports/${{ matrix.index }}/
          retention-days: 7
          if-no-files-found: ignore
