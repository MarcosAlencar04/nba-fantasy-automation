name: NBA Fantasy

on:
  schedule:
    # 10:00 em Brasilia (UTC-3). O cron do GitHub e sempre UTC.
    - cron: "0 13 * * *"
    # A cada 15 min: o gate.py libera 15 min antes de CADA jogo do dia,
    # entao cada jogo tem sua propria reavaliacao da escalacao.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "morning = relatorio da manha; gate = so se estiver perto do jogo"
        type: choice
        default: morning
        options: [morning, gate]

permissions:
  contents: read

concurrency:
  group: nba-fantasy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.schedule == '0 13 * * *' && 'morning' || github.event.inputs.mode || 'gate' }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PREGAME_LEAD_MIN: "15"
      ADDS_USED: ${{ vars.ADDS_USED }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decidir se executa agora
        id: gate
        run: python gate.py

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Rodar o agente
        if: steps.gate.outputs.run == 'true'
        run: |
          # A execucao da manha traz o relatorio completo; as demais (pre-jogo)
          # trazem so escalacao e IR.
          ARGS="--notify"
          if [ "$MODE" != "morning" ]; then
            ARGS="$ARGS --lineup-only"
          fi
          echo "modo: $MODE | args: $ARGS"
          python nba-fantasy-agent.py $ARGS

      - name: Guardar o relatorio
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
